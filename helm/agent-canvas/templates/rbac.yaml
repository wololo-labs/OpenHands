{{- $fullName := include "agent-canvas.fullname" . -}}
{{- $saName := include "agent-canvas.serviceAccountName" . -}}
{{- $saNs := .Release.Namespace -}}
{{- $labels := include "agent-canvas.labels" . -}}

{{/*
  Per-namespace bindings. Each entry in .Values.rbac.namespaces gets a
  RoleBinding to the built-in `admin` ClusterRole, granting the agent
  full access to all resources in that namespace (create/update/delete
  Pods, Deployments, Services, etc.) but NOT to cluster-scoped resources.
*/}}
{{- if .Values.rbac.enabled }}
{{- range $ns := .Values.rbac.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-admin
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $saNs }}
{{- end }}
{{- end }}

{{/*
  Optional cluster-admin binding. Off by default because it grants full
  control of the whole cluster including all namespaces, nodes, CRDs,
  RBAC itself, etc. Turn on with rbac.clusterAdmin=true only when the
  agent legitimately needs to manage the entire cluster.
*/}}
{{- if and .Values.rbac.enabled .Values.rbac.clusterAdmin }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullName }}-cluster-admin
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $saNs }}
{{- end }}

{{/*
  Kubernetes discovery source. Listing Services is the whole permission the
  registry needs to populate itself, so it gets its own namespace-scoped Role
  rather than riding on the broad `admin` binding above, which is off by
  default and grants far more than this.
*/}}
{{- if and .Values.registry.enabled .Values.registry.sources.kubernetes.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-registry-discovery
  namespace: {{ $saNs }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullName }}-registry-discovery
  namespace: {{ $saNs }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullName }}-registry-discovery
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ $saNs }}
{{- end }}
