apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-canvas.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-canvas.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "agent-canvas.selectorLabels" . | nindent 4 }}
---
# Headless service required by the StatefulSet for stable network IDs.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-canvas.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-canvas.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "agent-canvas.selectorLabels" . | nindent 4 }}

{{- if .Values.agentPool.enabled }}
{{- $fullName := include "agent-canvas.fullname" . }}
{{- $root := . }}
{{- range $index := until (int .Values.agentPool.replicas) }}
---
# One Service per pool member, addressed by the cluster DNS name
# `<name>.<namespace>.svc.cluster.local` that the registry's Kubernetes source
# builds. Per member, not one in front of all of them: pool members each keep
# their own conversations on their own PVC, so a Service load-balancing across
# them would answer a conversation lookup from whichever member happened to be
# picked. Discovery by Service is then also discovery by member, which is what
# makes the backend switcher list machines rather than one endpoint.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-{{ $index }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "agent-canvas.labels" $root | nindent 4 }}
    # The label scripts/registry/sources/k8s.mjs selects on. It names what the
    # Service fronts (an agent server), which is why it differs from the
    # chart's own app.kubernetes.io/name.
    app.kubernetes.io/name: agent-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $root.Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "agent-canvas.selectorLabels" $root | nindent 4 }}
    # Set by the StatefulSet controller on every pod it owns, so this Service
    # resolves to exactly one member.
    statefulset.kubernetes.io/pod-name: {{ $fullName }}-{{ $index }}
{{- end }}
{{- end }}
